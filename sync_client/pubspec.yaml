name: nascab_sync
description: "WaterNasOS 目录同步客户端 —— 电脑 <-> NAS 目录同步的 Windows 独立程序"
publish_to: 'none'
version: 2.0.0+3

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 状态管理（同步引擎使用 Rx 类型）
  get: ^4.7.2
  # API 请求（同步接口）
  http: ^1.6.0
  # 分块上传（同步上传走 /api/file/upload/*）
  dio: ^5.9.0
  # 上传会话哈希
  crypto: ^3.0.3
  # 路径处理（Windows 需 p.join / p.basename）
  path: ^1.9.0
  # 本地配置目录（基线库 sync.db 落盘位置）
  path_provider: ^2.1.5
  # 登录态与用户偏好持久化
  shared_preferences: ^2.5.3
  # 同步基线本地库
  # sqlite3 3.x 起原生库由 native assets（build hooks）自动构建，
  # 不再需要 sqlite3_flutter_libs（该包已 EOL：0.6.0+eol）。
  sqflite_common_ffi: ^2.4.4
  sqlite3: ^3.7.1
  # 选择本地同步目录
  file_picker: ^10.3.7
  # 桌面窗口（关窗进托盘、单实例）
  window_manager: ^0.5.1
  # 系统托盘常驻
  tray_manager: ^0.5.2
  # 目录同步核心：与 PC 主客户端（flutter_client）共用同一份实现
  nascab_sync_core:
    path: ../packages/nascab_sync_core

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/


# sqlite3 3.x 的原生库由 Dart build hooks 产出。默认会从 GitHub Releases 下载预编译 DLL，
# 该地址在受限网络下经常拉不到（报 "Building native assets failed"）。
# 统一改为用仓库内的官方 amalgamation 源码本地编译，构建完全离线、可重现。
hooks:
  user_defines:
    sqlite3:
      source: source
      path: ../third_party/sqlite3/sqlite3.c
      defines:
        default_options: true
