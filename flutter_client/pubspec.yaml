name: WaterNasOS
description: "WaterNasOS"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 2.0.0+37
environment:
  sdk: ^3.10.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  http: ^1.6.0
  web_socket_channel: ^3.0.0
  async: ^2.13.0
  stream_channel: ^2.1.4
  loading_animation_widget: ^1.3.0 #loading组件
  shared_preferences: ^2.5.3 #本地数据存储
  flutter_localizations: # 国际化支持
    sdk: flutter
  udp: ^5.0.3 # UDP通信支持
  provider: ^6.1.5+1
  crypto: ^3.0.3 # SHA256加密支持
  encrypt: ^5.0.3 # AES加密支持
  get: ^4.7.2
  connectivity_plus: ^7.3.2
  device_info_plus: ^13.3.0 # 设备信息
  package_info_plus: ^10.2.2 # 应用信息
  flutter_box_transform: ^0.4.7 # 应用窗口组件
  flutter_context_menu: ^0.4.0 # 右键菜单组件
  flutter_spinkit: ^5.1.0
  flutter_cache_manager: ^3.4.1 # 缓存库
  extended_image: ^10.0.1 # 图片扩展库
  dio: ^5.9.0
  # 12.0 起联邦化重写：PlatformFile 变抽象类，size→lengthSync()、bytes→readAsBytes()、identifier 移除。
  # ⚠ 与 share_plus/package_info_plus/device_info_plus 被 win32 major 版本绑定，只能整组升降。
  file_picker: ^13.1.0
  cross_file: ^0.3.5+1 # 跨平台文件操作库
  web: ^1.1.1
  path: ^1.9.0 # 跨平台路径处理
  latlong2: ^0.10.1
  desktop_drop: ^0.8.0
  flutter_dropzone: ^4.2.1
  intl: ^0.20.2
  url_launcher: ^6.3.2
  path_provider: ^2.1.5
  wechat_assets_picker: ^10.1.1
  video_player: ^2.10.1
  window_manager: ^0.5.1
  wakelock_plus: ^1.4.0
  uuid: ^4.5.2
  video_player_web_hls:
    path: packages/video_player_web_hls
  flutter_fullscreen: ^1.2.0
  flutter_map: ^8.2.2
  panorama_viewer: ^3.0.0
  webview_flutter: ^4.10.0
  permission_handler: ^13.0.2
  flutter_lyric: 3.0.2 # 4.x 用 preset 体系取代 LyricStyle，歌词视图需重写；保留 3.0.2
  xterm: ^4.0.0
  code_text_field: ^1.1.0
  linked_scroll_controller: ^0.2.0
  highlight: ^0.7.0
  flutter_highlight: ^0.7.0
  qr_flutter: ^4.1.0
  qr_code_scanner: ^1.0.1
  flutter_quill: 11.6.0
  flutter_quill_extensions: ^11.0.0
  dart_quill_delta: ^10.8.3
  sqflite_common_ffi: ^2.4.4
  sqlite3: ^3.7.1
  share_plus: ^13.3.1
  # 视频首帧缩略图。fork 自 pub 上的 0.5.6（已停更）：
  # 原版 android/build.gradle 用 jcenter() + 硬编码 AGP 4.1.0，Gradle/AGP 升级后会直接失败。
  video_thumbnail:
    path: packages/video_thumbnail
  photo_manager: ^3.9.0
  flutter_webrtc: ^1.3.1
  audio_service: ^0.18.18
  audio_session: 0.2.4
  just_audio: ^0.10.5
  tray_manager: ^0.5.2 # 0.8 换用 nativeapi+cnativeapi（需编 C++ 原生库，构建卡死 26 分钟）⇒ 保留 0.5.2
  flutter_read:
    path: packages/flutter_read
  pdfrx: 2.6.5
  flutter_local_notifications: ^22.3.2
  flutter_quill_to_pdf: ^2.3.9
  pdf: ^3.13.1
  fvp: ^0.38.1 # 0.39 首次构建要从 SourceForge 下 mdk-sdk nightly（CMake 不走 HTTP 代理）⇒ 保留 0.38.1
  # 目录同步核心：与 sync_client（Windows 独立同步客户端）共用同一份实现
  nascab_sync_core:
    path: ../packages/nascab_sync_core
  flex_color_scheme: 8.4.0 # 9.0 改用 Flutter 3.47 新拆分出的 material_ui 包，其 ThemeData 与 package:flutter/material.dart 的类型不兼容；升级需整体迁 material_ui
  tabler_icons_plus: ^3.44.0 # Tabler 开源图标（MIT），窗口控制按钮等使用

dependency_overrides:
  # 覆盖 pub 版：修复 Android MediaSession.onPlayPause 未转发（桌面小组件/部分系统播放暂停键无响应）
  audio_service:
    path: packages/audio_service
  dchs_motion_sensors:
    path: packages/dchs_motion_sensors
  # image 4.11.0 的 png_decoder 用了 dart:io ZLibDecoder.decodeLazy，
  # 当前 Flutter 3.47.5 / Dart 3.13.4 没有该方法 ⇒ Windows 端编译报错。
  # 锁回 4.10.1（该版本此前可正常构建，pub 缓存中已存在）。
  image: 4.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: assets/home/logo.png
  min_sdk_android: 21
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/home/logo.png
  web:
    generate: true
    image_path: assets/home/logo.png
  windows:
    generate: true
    image_path: assets/home/logo.png
    icon_size: 256
  macos:
    generate: true
    image_path: assets/home/logo.png
  linux:
    generate: true
    image_path: assets/home/logo.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # Enable code generation for localization
  generate: true

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/home/
    - assets/app_icons/
    - assets/app_icon.ico
    - assets/tray_icon_round.ico
    - assets/icons/
    - assets/icons/home/
    - assets/icons/file/
    - assets/icons/book/
    - assets/icons/video/
    - assets/icons/vip/
    - assets/icons/encrypted/
    - assets/web/
    - assets/web/reader/
    - assets/web/reader/ui/
    - assets/web/reader/vendor/
    - assets/web/reader/vendor/pdfjs/
    - assets/web/reader/vendor/pdfjs/cmaps/
    - assets/web/reader/vendor/pdfjs/standard_fonts/
    - assets/web/viewer/
    - assets/web/viewer/js-preview-lib/
    - assets/subfont.ttf
    - assets/music/musicCover/
    - assets/music/icons/
    - assets/book/
    - assets/app/home/
  fonts:
    - family: RobotoMono
      fonts:
        - asset: assets/fonts/RobotoMono-Regular.ttf
  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# sqlite3 3.x 起原生库由 Dart build hooks 负责产出，不再依赖 sqlite3_flutter_libs（已 EOL）。
# 默认策略是从 GitHub Releases 下载预编译 DLL
# （https://github.com/simolus3/sqlite3.dart/releases/download/sqlite3-x.y.z/...），
# 该地址在受限网络下经常拉不到，表现为 `flutter build` 报
# "Building native assets failed" / "This failed (attempted to download ...)"。
# 因此固定为「用仓库内的官方 amalgamation 源码本地编译」，构建完全离线、可重现。
hooks:
  user_defines:
    sqlite3:
      source: source
      path: ../third_party/sqlite3/sqlite3.c
      defines:
        default_options: true
