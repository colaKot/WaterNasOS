# WaterNasOS 官方站点（wnos.gexuan.net）
#
# 域名：wnos.gexuan.net（gexuan.net 的子域，A 记录 → 106.54.217.61）
# 证书：acme.sh（阿里云 DNS-01）签发，/etc/nginx/ssl/wnos.gexuan.net/，cron 自动续期
#
# 安装位置：/etc/nginx/sites-available/swim-wnos（软链到 sites-enabled/swim-wnos）
# 站点根目录：/srv/wnos/www（部署源：/srv/wnos/deploy/）
# 安装脚本：sudo bash /srv/wnos/deploy/deploy-wnos.sh
#
# ⚠️ 不要设为 default_server：swim-blog（www.gexuan.net）占着 80/443 默认站，
#    本配置用 server_name 精确匹配 wnos.gexuan.net，与博客站互不干扰。
# ⚠️ 与 swim-api（106.54.217.61 精确匹配）同样互不干扰。

server {
    listen 80;
    listen [::]:80;
    server_name wnos.gexuan.net;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wnos.gexuan.net;

    ssl_certificate     /etc/nginx/ssl/wnos.gexuan.net/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/wnos.gexuan.net/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root /srv/wnos/www;
    index index.html;

    client_max_body_size 24m;

    access_log /var/log/nginx/swim-wnos.access.log;
    error_log  /var/log/nginx/swim-wnos.error.log warn;

    add_header X-Content-Type-Options nosniff;

    # ---------- 静态页 ----------
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    location ~* \.(?:css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }
}
